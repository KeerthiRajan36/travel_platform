version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_pass
      POSTGRES_DB: travel_db
    ports:
      - "5432:5432"
    volumes:
      - travel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://travel_user:travel_pass@db:5432/travel_db
      SECRET_KEY: change-this-to-a-long-random-string-in-production
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # --- Optional: Celery worker + beat scheduler for scheduled jobs ---------
  # (e.g. daily upcoming-tour reminders). Uncomment to run them alongside
  # the API. Both need CELERY_BROKER_URL pointed at Redis to actually use
  # it as a broker instead of the in-process eager fallback.
  #
  # celery_worker:
  #   build: .
  #   restart: unless-stopped
  #   depends_on: [redis, db]
  #   environment:
  #     DATABASE_URL: postgresql+psycopg2://travel_user:travel_pass@db:5432/travel_db
  #     CELERY_BROKER_URL: redis://redis:6379/0
  #     CELERY_RESULT_BACKEND: redis://redis:6379/1
  #   command: >
  #     sh -c "pip install --no-cache-dir psycopg2-binary &&
  #            celery -A app.celery_app worker --loglevel=info"
  #
  # celery_beat:
  #   build: .
  #   restart: unless-stopped
  #   depends_on: [redis, db]
  #   environment:
  #     DATABASE_URL: postgresql+psycopg2://travel_user:travel_pass@db:5432/travel_db
  #     CELERY_BROKER_URL: redis://redis:6379/0
  #     CELERY_RESULT_BACKEND: redis://redis:6379/1
  #   command: >
  #     sh -c "pip install --no-cache-dir psycopg2-binary &&
  #            celery -A app.celery_app beat --loglevel=info"

volumes:
  travel_pgdata:
